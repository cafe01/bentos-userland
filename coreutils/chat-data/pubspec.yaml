name: chat_data
description: chat-data — the ChatInference data model as a CLI codec. Construct, serialize, validate, and fold ChatMessage/ChatEvent from the shell.
version: 0.1.0
publish_to: none

executables:
  chat-data:
    main: bin/chat_data.dart

resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.4.0
  bentos_userland:
    path: ../..
  chat_inference:
    path: ../../../chat-inference-dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
