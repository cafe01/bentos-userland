name: llm
description: The inert inference coreutil — opens /dev/llm/<vendor>/<model> and streams the answer. Knows no keys, no vendors, no drivers.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.8.0

executables:
  llm:

dependencies:
  args: ^2.4.0
  bentos_userland:
    path: ../..
  chat_inference:
    path: ../../../chat-inference-dart

dev_dependencies:
  bentos_driver_sdk:
    path: ../../../bentos-driver-sdk-dart
  fixnum: ^1.1.0
  lints: ^6.0.0
  stream_channel: ^2.1.0
  test: ^1.24.0
