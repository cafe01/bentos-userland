name: bentos_userland
description: The bentos stdlib — what userland app programmers depend on. The client-side syscall surface over bentos-kernel capabilities.
version: 0.1.0
repository: https://github.com/cafe01/bentos-userland

environment:
  sdk: ^3.8.0

publish_to: none

# This repo IS "what you install when you install HumanOS": the libc plus its
# coreutils, resolved as one pub workspace.
workspace:
  - coreutils/llm

dependencies:
  bentos_driver_sdk:
    path: ../bentos-driver-sdk-dart
  chat_inference:
    path: ../chat-inference-dart
  fixnum: ^1.1.0
  stream_channel: ^2.1.0
  # The drivers the in-process kernel stand-in (lib/boot.dart) wires behind
  # /dev/llm/*. They live here, behind the device — never in a coreutil's main.
  anthropic_chat_driver:
    path: ../anthropic-chat-driver
  openai_chat_driver:
    path: ../openai-chat-driver

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
