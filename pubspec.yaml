name: bentos_userland
description: The bentos stdlib — what userland app programmers depend on. The client-side syscall surface over bentos-kernel capabilities.
version: 0.1.4
repository: https://github.com/cafe01/bentos-userland
homepage: https://github.com/cafe01/bentos-userland

topics:
  - agent
  - ai
  - cli
  - coreutils
  - bentos

publish_to: none
environment:
  sdk: ^3.8.0

# This repo IS "what you install when you install HumanOS": the libc plus its
# coreutils, resolved as one pub workspace.
workspace:
  - coreutils/websearch

dependencies:
  args: ^2.4.0
  ansicolor: ^2.0.3
  term_glyph: ^1.2.2
  file: ^7.0.0
  path: ^1.9.0
  yaml: ^3.1.0
  xml: ^6.5.0
  # the installer's own: config is TOML, releases arrive over HTTP, artifacts
  # are verified by sha256 before anything is linked.
  toml: ^0.18.0
  http: ^1.2.2
  crypto: ^3.0.3
  # Siblings resolve against their own repositories, never by path: a path here
  # is what made this package unbuildable outside a campus checkout. The local
  # convenience returns as pubspec_overrides.yaml, which git ignores.
  bentos_abi:
    git:
      url: https://github.com/cafe01/bentos-abi.git
      ref: 5805b8a9e4e238ebc3d8978d4f34ead4cb28b1d6
  bentos_driver_sdk:
    git:
      url: https://github.com/cafe01/bentos-driver-sdk-dart.git
      ref: 1dc9212b7895a7063ba78b12cb6b42ea7610d192
  chat_inference:
    git:
      url: https://github.com/cafe01/chat-inference-dart.git
      ref: 64b2abd3c3b268948fa2b669cff5bc6a9e200042
  stt_inference:
    git:
      url: https://github.com/cafe01/stt-inference-dart.git
      ref: 0a60fd8e9ff5f20e61fc0f4995984dc61cb2d1c2
  tts_inference:
    git:
      url: https://github.com/cafe01/tts-inference-dart.git
      ref: ec46bfc863aed7db836033e059b1df5fd5d9f68a
  fixnum: ^1.1.0
  stream_channel: ^2.1.0
  # coreutil libs — exposed via bin/ shells
  websearch:
    path: coreutils/websearch
  # Vendor drivers — bound into the boot table by lib/bundled_drivers.dart, the
  # distribution entrypoint. The core (lib/src, lib/bentos_userland.dart) does
  # NOT import these, which is what keeps the cycle broken: whoever assembles a
  # distribution imports the one file that knows the vendors.
  anthropic_chat_driver:
    git:
      url: https://github.com/cafe01/anthropic-chat-driver.git
      ref: 8789071ef15d091fd73281c37939a23dffb2a291
  openai_chat_driver:
    git:
      url: https://github.com/cafe01/openai-chat-driver.git
      ref: 9101096b027001de80eca05b298c0ed9959c9a3b
  openai_stt_driver:
    git:
      url: https://github.com/cafe01/openai-stt-driver.git
      ref: 8b1259026887a3e8ce6a4aa71ae09772e0194a6e
  openai_live_stt_driver:
    git:
      url: https://github.com/cafe01/openai-live-stt-driver.git
      ref: e4b0cb4d13a332400bd1dc93dd085c1b4771534f
  openai_tts_driver:
    git:
      url: https://github.com/cafe01/openai-tts-driver.git
      ref: 635e6beaba441a47b17d8b7042af84ecfffee0ac

dev_dependencies:
  bentos_kernel:
    git:
      url: https://github.com/cafe01/bentos-kernel.git
      ref: 6b07f04944b4e8ab77a4e7eac96d941ec9de9cc5
  lints: ^6.0.0
  test: ^1.24.0
