name: bentos_userland
description: The bentos stdlib — what userland app programmers depend on. The client-side syscall surface over bentos-kernel capabilities.
version: 0.1.0
repository: https://github.com/cafe01/bentos-userland
homepage: https://github.com/cafe01/bentos-userland

topics:
  - agent
  - ai
  - cli
  - coreutils
  - bentos

environment:
  sdk: ^3.8.0

# This repo IS "what you install when you install HumanOS": the libc plus its
# coreutils, resolved as one pub workspace.
workspace:
  - coreutils/llm
  - coreutils/chatbot
  - coreutils/websearch
  - coreutils/chat-data
  - coreutils/chat-render
  - coreutils/tx
  - coreutils/chat

executables:
  chat:
  chat-codec: chat_codec
  chat-data: chat_data
  chat-render: chat_render
  chatbot:
  llm:
  tx:
  websearch:

dependencies:
  args: ^2.4.0
  bentos_abi:
    path: ../bentos-abi
  bentos_driver_sdk:
    path: ../bentos-driver-sdk-dart
  chat_inference:
    path: ../chat-inference-dart
  fixnum: ^1.1.0
  stream_channel: ^2.1.0
  # coreutil libs — exposed via bin/ shells
  chat:
    path: coreutils/chat
  chat_data:
    path: coreutils/chat-data
  chat_render:
    path: coreutils/chat-render
  chatbot:
    path: coreutils/chatbot
  llm:
    path: coreutils/llm
  tx:
    path: coreutils/tx
  websearch:
    path: coreutils/websearch
  # Vendor drivers — needed by bin/_drivers.dart at AOT compile time.
  # lib/ does NOT import these (cycle stays broken); only bin/ does.
  anthropic_chat_driver:
    path: ../anthropic-chat-driver
  openai_chat_driver:
    path: ../openai-chat-driver

dev_dependencies:
  bentos_kernel:
    path: ../bentos-kernel
  lints: ^6.0.0
  test: ^1.24.0
