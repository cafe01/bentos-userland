# Publishes bentos-userland as a release: one asset per executable per platform,
# named <name>-<platform>, plus the enriched bentos-release.json and the
# bootstrap that installs it.
#
# It lives here because this repository is the producer. The campus is a private
# workspace that produces nothing, and a release cut from it would be an
# artifact with no public origin — so the workflow follows the repo whose name
# the product carries.
#
# **The matrix is the cross-compiler.** `dart compile exe` produces a binary for
# the host it runs on and for nothing else, so the only way to serve four
# platforms is to build on four machines — which the runners give us for free
# now that the repository is public. The three worlds are not hypothetical: one
# of us works on Linux, one on a Mac, and the design partner this whole front
# exists for is on Windows.
#
# The build fans out and the assembly gathers. Splitting them is what keeps the
# release honest under parallelism: four jobs racing to create one release would
# race, and four jobs each uploading their own bentos-release.json would leave
# whichever landed last as the whole truth — a manifest claiming one platform
# while three others sat published beside it. Instead each job hands its
# binaries up as a workflow artifact, and one job enriches once per platform
# into a single accumulating manifest before anything is published.
#
# A platform is declared in the manifest as intent; an *artifact* is a claim
# that a binary exists and hashes to this. A job that falls records nothing, so
# the manifest never lies about a platform nobody compiled — and the gate at the
# end is what says so out loud.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created if absent)'
        required: true

permissions:
  contents: write

defaults:
  run:
    # Windows runners default to PowerShell; the build is one bash script on
    # every host, and Git Bash is present on the Windows image.
    shell: bash

jobs:
  build:
    # The sibling packages are declared by SSH URL, which a runner has no key
    # for. The repositories are public, so the same clone over HTTPS succeeds
    # with no credential at all — rewritten here rather than in the pubspecs
    # because that edit spans eleven repositories and belongs to a pass of its
    # own. Declared debt, not a workaround: a developer keeps their SSH remotes.
    strategy:
      # Every platform gets its verdict. One falling must not cancel the three
      # that would have succeeded — that is the difference between a matrix that
      # reports and a matrix that hides.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-latest
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    # `fail-fast: false` reports a platform that FALLS; a platform that is never
    # scheduled falls through it — and `assemble`, though it runs `if: always()`,
    # still waits for every need to *complete*. One image without capacity
    # therefore hangs the whole release forever, silently, which is how v0.1.1
    # sat queued for an hour with three platforms built and nothing published.
    # The ceiling converts that wait into a verdict the gate can name.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0

      - name: Reach the public siblings over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Resolve dependencies
        run: dart pub get

      # The same script a developer runs by hand, pointed at a staging directory
      # instead of ~/.local/bin. Using it rather than a compile loop of its own
      # is the point: CI and the hand build the same set, by the same registry,
      # or they are two registries again.
      - name: Compile the declared set
        run: PREFIX="${{ runner.temp }}/stage" bash script/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.platform }}
          path: ${{ runner.temp }}/stage
          if-no-files-found: error

  assemble:
    needs: build
    # Deliberately not `success()`: the release is cut from whatever compiled,
    # and a platform that fell is reported by the gate rather than by the
    # absence of a release. What is published is true; what is missing is named.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0

      - name: Reach the public siblings over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Resolve dependencies
        run: dart pub get

      # Pre-flight, and it blocks: the tag against the version of the commit it
      # points at. The version has one home (the pubspec) and the manifest is
      # stamped from it, so the only seam left is the one no build can read —
      # the name the tag was cut under.
      - name: Gate — the tag names the version being published
        run: dart tool/manifest.dart check-tag "${{ github.event.inputs.tag || github.ref_name }}"

      - uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          path: staged

      # One manifest for the whole release. `enrich` accumulates: given its own
      # previous output it keeps the other platforms' artifacts and replaces
      # this one's — so the loop over what actually arrived produces exactly the
      # set of binaries that exist, and nothing for a job that fell.
      - name: Enrich the manifest, platform by platform
        run: |
          out="${{ runner.temp }}/bentos-release.json"
          mkdir -p "${{ runner.temp }}/dist"
          for dir in staged/stage-*; do
            [ -d "$dir" ] || continue
            platform="${dir#staged/stage-}"
            echo "── $platform"
            dart tool/manifest.dart enrich "$platform" "$dir" "$out"
            for binary in "$dir"/*; do
              [ -f "$binary" ] || continue
              cp "$binary" "${{ runner.temp }}/dist/$(basename "$binary")-$platform"
            done
          done
          cat "$out"
          ls -l "${{ runner.temp }}/dist"

      # The bootstrap travels in the same release as the artifacts it fetches:
      # the URL a clean machine curls and what it downloads next are one thing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(dart tool/manifest.dart version)
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" \
                 --title "bentos-userland $version" \
                 --notes "Built by CI from $GITHUB_SHA. One asset per executable per platform; bentos-release.json carries the sha256 of each — verify before linking."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ runner.temp }}/bentos-release.json" \
            script/bootstrap.sh \
            script/bootstrap.ps1 \
            "${{ runner.temp }}"/dist/*

      # The witness is what the world received, fetched back over the network —
      # never the file this job just wrote, which would agree with itself. The
      # release stands and the job goes red, the same shape as the gate below.
      - name: Gate — the published release announces the tag's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          fetched="${{ runner.temp }}/published-bentos-release.json"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern bentos-release.json --output "$fetched" --clobber
          title=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          dart tool/manifest.dart check-published "$tag" "$fetched" "$title"

      # Last, and deliberately after publishing: what built is released, and the
      # job still goes red for whatever did not. A workflow that hid the
      # executable it could not build would be the bash array's defect wearing
      # different clothes.
      - name: Gate — every declared executable produced an artifact
        run: |
          failed=""
          for platform in linux-x64 macos-arm64 macos-x64 windows-x64; do
            missing=$(dart tool/manifest.dart missing "$platform" "${{ runner.temp }}/bentos-release.json")
            if [ -n "$missing" ]; then
              echo "::error::declared but not built for $platform: $(echo $missing)"
              failed="yes"
            else
              echo "$platform: every declared executable produced an artifact"
            fi
          done
          [ -z "$failed" ]

  # The only gate that touches the product the way a person does: the published
  # release, fetched over the network by the line a stranger copies, installed
  # into a HOME that did not exist a second ago. Everything above asserts about
  # what CI built; this asserts about what the world can get.
  #
  # It lives in `script/smoke-test.sh` and not in these steps because the hand
  # must be able to run exactly what CI runs — the whole defect it exists to
  # prevent is a proof that only one of the two can perform.
  #
  # Linux only, deliberately. macOS was proved by hand and has no runner budget
  # here.
  smoke:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Smoke — install, self-update, update and rollback the published line
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/smoke-test.sh

  # The Windows seam, declared red on purpose: this job runs after the release
  # is published, so its own verdict never gates Linux and macOS, and it fails
  # today by naming exactly what is missing — there is no bootstrap.ps1 in the
  # release yet. It turns green by itself, with nothing here to edit, the day
  # that script lands. Until then it is a standing, honest red rather than a
  # silent gap the matrix does not mention.
  smoke-windows:
    needs: assemble
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Smoke — install, self-update, update and rollback the published line, on Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/smoke-test.ps1
